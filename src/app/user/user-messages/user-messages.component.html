<div class="chat-popup">

  <div class="chat-card">
    <ng-container *ngIf="convo$ | async as convo">

      <!-- Header -->
      <div class="chat-header d-flex align-items-center px-2 py-2">
        <button class="btn btn-link text-white p-0 me-2" (click)="back()">
          <i class="bi bi-arrow-left fs-4"></i>
        </button>

        <img
          [src]="convo.user?.profile || 'https://github.com/mdo.png'"
          class="rounded-circle me-2"
          width="36"
          height="36"
        />

        <div class="fw-semibold">{{ convo.user?.name || "Admin" }}</div>
      </div>

      <!-- Messages -->
      <div class="messages-container bg-image">
        <div
          *ngFor="let msg of convo.messages"
          [ngClass]="{
            'message-row me': msg.senderId === convo.me?.id,
            'message-row them': msg.senderId !== convo.me?.id
          }"
        >
          <div class="bubble">{{ msg.message }}</div>
        </div>
      </div>

      <!-- Input -->
      <div class="input-area d-flex align-items-center px-2 py-2">
        <input
          [formControl]="messageText"
          class="form-control message-input"
          placeholder="Type a message..."
        />
        <button class="btn btn-primary ms-2 send-btn" (click)="sendMessage()">
          <i class="bi bi-send"></i>
        </button>
      </div>

    </ng-container>
  </div>

</div>
