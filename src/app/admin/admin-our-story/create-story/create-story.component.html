<div class="modal-header">
  <h5 class="modal-title">
    {{ id ? "Edit Story" : "Create Story" }}
  </h5>

  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body position-relative">
  <!-- LOADING OVERLAY -->
  <div
    class="position-absolute top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-white bg-opacity-75"
    *ngIf="isLoading"
    style="z-index: 10"
  >
    <div class="spinner-border" role="status"></div>
  </div>

  <form [formGroup]="storyForm" novalidate>
    <!-- TITLE -->
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input
        type="text"
        class="form-control"
        formControlName="title"
        [class.is-invalid]="
          storyForm.get('title')?.invalid && storyForm.get('title')?.touched
        "
      />

      <div class="invalid-feedback">Title is required.</div>
    </div>

    <!-- DESCRIPTION -->
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea
        class="form-control"
        rows="3"
        formControlName="description"
        [class.is-invalid]="
          storyForm.get('description')?.invalid &&
          storyForm.get('description')?.touched
        "
      ></textarea>

      <div class="invalid-feedback">Description is required.</div>
    </div>

    <!-- VIDEO UPLOAD -->
    <div class="mb-3">
      <label class="form-label">Video</label>

      <input
        type="file"
        accept="video/*"
        class="form-control"
        (change)="onVideoSelected($event)"
        [class.is-invalid]="!id && !selectedVideo && storyForm.touched"
      />

      <!-- Show current video if editing -->
      <div *ngIf="id && existingStory?.videoUrl" class="mt-2">
        <small class="text-muted">Current video:</small>
        <video
          width="220"
          controls
          class="d-block mt-1 border rounded"
          [src]="existingStory?.videoUrl"
        ></video>
      </div>

      <!-- Validation for create mode -->
      <div *ngIf="!id && !selectedVideo" class="text-danger small mt-1">
        Video is required for new stories.
      </div>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button class="btn btn-secondary" (click)="close()">Cancel</button>
  <button class="btn btn-primary" (click)="save()" [disabled]="isLoading">
    {{ id ? "Update" : "Create" }}
  </button>
</div>
